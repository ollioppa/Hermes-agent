English; documents use the readers' agreed language. [REFERENCE.md](REFERENCE.md) explains the preservation decisions for maintenance, not mandatory reading for every edit. Start with [README.md](README.md).\n\n## Establish the assignment\n\nRead the request, authoritative subject sources/design, current document and prior decisions. Establish readers, primary starting state, outcome, language and destination; reuse known answers. Extract purpose, mechanisms, alternatives and limits before choosing an example. Distinguish intended design, implemented behavior and observed results. Do not invent superiority, uniqueness or measured savings.\n\nFor an adoption guide, explain the specific contribution compared with the familiar alternative, including when that alternative is sufficient. The reason must stand without the example. An example cannot redefine the subject's primary scope. For a how-to, establish the task and result; an adoption pitch is unnecessary.\n\nIf a material gap remains, use the assignment's available research tools within their permissions or ask focused questions. An optional discovery helper must follow its own data-handling and report requirements; it is never a prerequisite. Do not expose private source material in shared documentation. Continue independent work while the affected explanation waits. Small corrections reuse established context rather than restarting discovery.\n\nKeep a short baseline in the existing authoritative project design or associated maintenance page: reader/outcome, supported value and sources, required content and purpose, reading paths, medium/language/viewport, decisions and open checks. Do not create a competing registry.\n","end_line":14,"evidence_note":"Verbatim text authority from the clean target commit; not executable Python and not a run record. Historical claims in this text are attributed to the source, not re-executed here.","execution_status":"NOT_EXECUTED_HERE","file":"documentation-guide/METHOD.md","id":"documentation-guide/METHOD.md:text:1-14","line":1,"name":"Text authority","provenance":"SOURCE_EXTRACTION","side_effects":[],"signature":"Text authority: documentation-guide/METHOD.md:1-14 (not a function)","source_binding":"BOUND","source_sha256":"51b5615a1d5db4b11ad9e6e8f31adca24e77de4bcfd735ef8c41879d93cee4a3","stage_id":"assignment"}],"title":"Establish the assignment","values":["documentation-guide/METHOD.md:5-13"]},{"artifact":"Chosen paths and destination requirements","artifact_binding":"UNKNOWN","execution_status":"NOT_EXECUTED_HERE","handoff":"Obtain feedback for substantial unapproved redesign before expanding.","id":"paths","provenance":"SOURCE_EXTRACTION","purpose":"Quickstart supports action; Presentation explains why. Use both only when both reader needs exist. Introductory entries require useful graphic, plain language and direction.","source_binding":"BOUND","source_units":[{"artifact_binding":"UNKNOWN","branches":[],"callees":[],"callers":[],"cleanup_status":"NOT_EXECUTED_HERE","code":"## Choose and draft the reader paths\n\nWhen both first understanding and repeat use matter, provide directly accessible, consistent paths sharing setup and technical facts:\n\n- **Quickstart:** brief bullet answers to purpose, specific value, fit, prerequisites, first action and expected result. No story before the action.\n- **Presentation:** connected introduction, explanation and useful ending. Explain purpose and relevant difference before examples; lead directly to the quickstart.\n\nA focused how-to or lookup can use one path. Presentation need not mean slides. Assess entries as a newcomer with sound judgment and little subject knowledge, without condescension.\n\nIntroductory entries require four things together: a useful small graphic, plain language, benefit/graphic/next step in one readable first view, and clear reader direction. A pure lookup may omit a graphic or narrative that adds no orientation; this exception does not waive the introductory requirements.\n\nCheck overload, condescension/boredom and direction before expanding. For adoption guides, remove the example temporarily and check that the specific value still stands. Repair weak entries first. For a substantial redesign, show concrete entry drafts and obtain feedback; an already approved direction or a small requested edit needs no new approval round.\n\nUse the actual destination viewport, provisionally 1366 × 768 at 100% zoom for browser guides. Include surrounding wiki or application navigation. Check mobile when required; never shrink text or hide essentials to force a fit. A source or desktop check is not evidence of fit in another viewer.\n","end_line":29,"evidence_note":"Verbatim text authority from the clean target commit; not executable Python and not a run record. Historical claims in this text are attributed to the source, not re-executed here.","execution_status":"NOT_EXECUTED_HERE","file":"documentation-guide/METHOD.md","id":"documentation-guide/METHOD.md:text:15-29","line":15,"name":"Text authority","provenance":"SOURCE_EXTRACTION","side_effects":[],"signature":"Text authority: documentation-guide/METHOD.md:15-29 (not a function)","source_binding":"BOUND","source_sha256":"51b5615a1d5db4b11ad9e6e8f31adca24e77de4bcfd735ef8c41879d93cee4a3","stage_id":"paths"}],"title":"Choose reader paths","values":["documentation-guide/METHOD.md:15-28"]},{"artifact":"Revised document with preserved decisions","artifact_binding":"UNKNOWN","execution_status":"NOT_EXECUTED_HERE","handoff":"Record dispositions in existing baseline and check unaffected material.","id":"revise","provenance":"SOURCE_EXTRACTION","purpose":"Put prerequisites before actions; connect action with result and recovery. Preserve decision meaning, prominence and location—not just keywords.","source_binding":"BOUND","source_units":[{"artifact_binding":"UNKNOWN","branches":[],"callees":[],"callers":[],"cleanup_status":"NOT_EXECUTED_HERE","code":"## Develop or revise\n\nConnect explanation/action to expected result. Introduce prerequisites and material warnings before use, explain necessary terms, provide recovery for common failures and end by fulfilling the opening promise. Keep deeper sections understandable. Use short connected paragraphs, lists for steps and tables for comparisons. Remove filler.\n\nFor revisions, identify affected decisions before editing. Preserve their **meaning, prominence and location in the needed reader path**, not just keywords. A shortened introductory quickstart retains its brief purpose/value answer in that quickstart. Unchanged requirements still apply. Afterwards record each affected decision's disposition, destination and actual check in the existing baseline; check for accidental loss elsewhere. Resolve genuine conflicts before dropping requirements.\n\nUse destination-supported graphics with readable labels and text equivalents; color alone cannot carry meaning. Preserve promised offline use. Moving between HTML, Markdown and wikis preserves purpose and navigation, not a fixed template. Unsupported diagram syntax is not a rendered graphic.\n","end_line":37,"evidence_note":"Verbatim text authority from the clean target commit; not executable Python and not a run record. Historical claims in this text are attributed to the source, not re-executed here.","execution_status":"NOT_EXECUTED_HERE","file":"documentation-guide/METHOD.md","id":"documentation-guide/METHOD.md:text:30-37","line":30,"name":"Text authority","provenance":"SOURCE_EXTRACTION","side_effects":[],"signature":"Text authority: documentation-guide/METHOD.md:30-37 (not a function)","source_binding":"BOUND","source_sha256":"51b5615a1d5db4b11ad9e6e8f31adca24e77de4bcfd735ef8c41879d93cee4a3","stage_id":"revise"},{"artifact_binding":"UNKNOWN","branches":[],"callees":[],"callers":[],"cleanup_status":"NOT_EXECUTED_HERE","code":"# Method reference and preservation decisions\n\nThis is a generic extraction of the original method's design, not its private history or a new framework. [METHOD.md](METHOD.md) is sufficient for normal use. This reference explains the original HG decision labels so maintenance does not require upstream files.\n\n## The decisions\n\n| ID | Meaning retained in this export | Where to check |\n| --- | --- | --- |\n| HG-01 | Readable for humans, including deeper sections. | METHOD: Develop or revise; actual reader journey. |\n| HG-02 | Little assumed subject vocabulary, sound judgment; no condescension. | METHOD: Choose and draft. |\n| HG-03 | Useful graphic, plain language, one readable first view and direction together for introductory entries. | METHOD: Choose and draft; rendered entry, not just markup. |\n| HG-04 | Presentation connects introduction, body and useful ending; repair the entry before expanding. | METHOD: Choose and draft; Develop or revise. |\n| HG-05 | Establish specific value against a fair alternative before the example; retain the brief answer in Quickstart. | METHOD: Establish; revision rule. |\n| HG-06 | Source-first context; targeted discovery for material gaps only. | METHOD: Establish. Generic available tools/questions replace optional host-specific discovery routing. |\n| HG-07 | Preserve meaning, prominence and location; record dispositions and actual checks. | METHOD: Develop or revise. |\n| HG-08 | English maintained method; agreed language for generated output. | METHOD opening. |\n| HG-09 | HTML, Markdown and wikis supported without a compulsory renderer. | METHOD: Develop or revise. |\n| HG-10 | Direct Quickstart and Presentation when both reader needs exist; shared facts/setup. | METHOD: Choose and draft. |\n| HG-11 | An example cannot redefine primary purpose, starting state or outcome. | METHOD: Establish. Private project illustration omitted, rule preserved. |\n| HG-12 | Focused how-to/lookup may use one path; lookup exception does not waive introductory requirements. | METHOD: Choose and draft. |\n| HG-13 | Design, implementation and observed evidence differ; checks establish only their actual scope. | METHOD: Establish; Check and deliver. |\n\n## Establish supported value without a sales pitch\n\nRead the authoritative subject design and relevant evidence, including reasons for decisions and alternatives. Trace reader situation → limitation of the familiar approach → specific mechanism → useful outcome. A design states intent; an implementation shows what exists; an exercised check supports only what it observed. If they conflict, mark the gap before using the claim.\n\nThe fair alternative may be sufficient. Do not manufacture exclusivity or measured time savings. Remove the example temporarily: if the reason to use the subject disappears, the explanation is not yet grounded. A how-to needs a clear task and outcome instead of an adoption argument.\n\n## Keep one short documentation baseline\n\nUse the existing project design or clearly associated maintenance page. Record:\n\n- reader, knowledge, primary starting state, goal and prerequisites;\n- supported purpose/value, source references, alternatives and limits;\n- required content and why it matters;\n- reader paths and shared detail destinations;\n- language, medium, actual review viewport and success criteria;\n- binding decisions, their source, intended prominence, current location and open checks.\n\nBefore an edit read request, baseline and current document together. The current text alone does not prove all earlier decisions survived. For each affected decision record **preserved, rephrased, moved or deliberately replaced**, its new location and what was actually checked. Inspect unaffected content for accidental losses. Resolve conflicts before silently dropping requirements. This is an update to existing maintenance, not a new registry or per-message ceremony.\n\n## Reader paths and visual checks\n\nQuickstart supplies short answers and immediate action. Presentation explains purpose and relevant difference, develops the reasoning and fulfills the opening promise. A returning reader must not replay the explanation to act. Shortening Quickstart can move detailed setup behind a direct link; it cannot move its agreed brief purpose/value answer entirely into Presentation.\n\nFor introductory entries check benefit, graphic, next step and readable language together at the actual viewport. Ask whether the entry overloads the reader, explains the obvious or leaves direction unclear. Early feedback is for substantial unapproved redesign, not every small correction. The provisional browser viewport is 1366 × 768 at 100% zoom; include surrounding host UI. Mobile checking is a separate obligation when required. A Markdown source has no universal pixel layout.\n\nA graphic explains a useful relation, uses readable labels and has a text equivalent. Do not rely on unsupported interactive elements or raw diagram syntax. A focused lookup can omit ornamental graphics and narrative. These boundaries retain the method's existing distinctions rather than applying every rule to every reply.\n\n## Honest handover\n\nFollow actionable instructions and inspect the intended destination where possible. Report actual checks and remaining ones. A valid link does not prove good explanation; a local browser does not prove wiki publication; an author-run task does not prove newcomer comprehension. Access and publication permissions are separate. No automatic quality score, extra reviewer fleet or new execution system is required.","end_line":52,"evidence_note":"Verbatim text authority from the clean target commit; not executable Python and not a run record. Historical claims in this text are attributed to the source, not re-executed here.","execution_status":"NOT_EXECUTED_HERE","file":"documentation-guide/REFERENCE.md","id":"documentation-guide/REFERENCE.md:text:1-52","line":1,"name":"Text authority","provenance":"SOURCE_EXTRACTION","side_effects":[],"signature":"Text authority: documentation-guide/REFERENCE.md:1-52 (not a function)","source_binding":"BOUND","source_sha256":"0ca4e451c3af6bc955f25bce1474f2b61870d4ab714407e1ce3127e3e2e625bf","stage_id":"revise"}],"title":"Develop and preserve meaning","values":["documentation-guide/METHOD.md:30-36","documentation-guide/REFERENCE.md:7-21"]},{"artifact":"Document and honest handover","artifact_binding":"UNKNOWN","execution_status":"NOT_EXECUTED_HERE","handoff":"Deliver artifact plus actual checks and open points; publication needs authorization.","id":"check","provenance":"SOURCE_EXTRACTION","purpose":"Inspect destination and follow actionable steps where possible. Local checks do not prove reader success or publication.","source_binding":"BOUND","source_units":[{"artifact_binding":"UNKNOWN","branches":[],"callees":[],"callers":[],"cleanup_status":"NOT_EXECUTED_HERE","code":"## Check and deliver\n\nReview the affected reader journey, setup, links, examples, shared facts and success signs. Inspect the actual destination and follow actionable instructions where possible. For a substantial guide, an available native reviewer may check supplied decisions and return omissions with locations and concrete repairs. Keep that optional review read-only and bounded, without further delegation. Small edits need no helper.\n\nUpdate the baseline and hand over the artifact, actual checks and open points. Check destination access before publishing; an inaccessible destination gets a transferable draft with the remaining check stated. Publication requires authorization. Local structure checks do not prove readability, publication or newcomer success. Use enough checking for the changed work; no mandatory phase system, scoring program or review loop.","end_line":42,"evidence_note":"Verbatim text authority from the clean target commit; not executable Python and not a run record. Historical claims in this text are attributed to the source, not re-executed here.","execution_status":"NOT_EXECUTED_HERE","file":"documentation-guide/METHOD.md","id":"documentation-guide/METHOD.md:text:38-42","line":38,"name":"Text authority","provenance":"SOURCE_EXTRACTION","side_effects":[],"signature":"Text authority: documentation-guide/METHOD.md:38-42 (not a function)","source_binding":"BOUND","source_sha256":"51b5615a1d5db4b11ad9e6e8f31adca24e77de4bcfd735ef8c41879d93cee4a3","stage_id":"check"}],"title":"Check and deliver honestly","values":["documentation-guide/METHOD.md:38-42"]},{"artifact":"Illustrative line-counting how-to, not an observed run here","artifact_binding":"UNKNOWN","execution_status":"NOT_EXECUTED_HERE","handoff":"Compare meanings and position, not identical wording; keep command-check claims attributed.","id":"example","provenance":"SOURCE_EXTRACTION","purpose":"Source facts, weak Before, After and preservation table demonstrate source-first repair. It is a newly constructed exercise, not a historical case.","source_binding":"BOUND","source_units":[{"artifact_binding":"UNKNOWN","branches":[],"callees":[],"callers":[],"cleanup_status":"NOT_EXECUTED_HERE","code":"# New illustrative example: count lines without changing a file\n\n**Created for this export.** The source facts, weak Before text and After text below are a newly constructed teaching example. They are not private documents, a historical application, a controlled comparison or evidence that another reader succeeded. The command was executed locally: three lines returned 3, an empty file returned 0, and a final newline did not add a line. This is a command check, not an independent reader study.\n\n## Source facts and assignment\n\n- Reader: someone comfortable opening a terminal, unfamiliar with Python line counting.\n- Task: count all lines in a UTF-8 text file without changing it. Blank lines count. A final line without a newline counts too. This is not a count of words, records or nonempty lines.\n- Environment: Python 3 available as `python3`; a terminal opened in the directory containing `sample.txt`.\n- Fixture: `sample.txt` contains exactly `apple\\n\\npear`, where `\\n` means a newline character. This is three lines, with no final newline.\n- Implementation: `Path.read_text(encoding='utf-8').splitlines()` reads and splits text; `len(...)` counts the resulting lines. An empty file yields zero. The command loads the file in memory; this guide is not for very large files.\n- Boundaries: no write operation in the counting command; missing file and invalid UTF-8 need explicit recovery. Do not silently ignore decoding errors or overwrite the input.\n- Requested output: a compact English how-to. One action path is sufficient; no adoption claim or second presentation is needed.\n\nThese are the complete source facts for the exercise, not claims about a separate product. The preservation baseline is the table below.\n\n## Before — deliberately weak draft\n\nUse Python to inspect your content. Run the line counter on the input and check the count. If it fails, fix the file and try again. This makes processing easy.\n\n## After — method applied\n\n### Count every line in a small text file\n\nThis command counts lines, including blank ones, without changing your file. It also counts a final line without a trailing newline. It does not count words or nonempty records.\n\n**Before starting:** use a small UTF-8 file named `sample.txt`, have Python 3 available as `python3`, and open a terminal in the folder containing the file. The command reads the whole file into memory, so choose another approach for very large files.\n\nFor the practice input, use a text editor to create `sample.txt` in a new practice folder. Enter `apple` on line one, leave line two blank, and enter `pear` on line three. A final newline is optional for this count. Save as UTF-8. Use a new file; do not replace existing work.\n\nRun in that folder:\n\n```sh\npython3 -c \"from pathlib import Path; print(len(Path('sample.txt').read_text(encoding='utf-8').splitlines()))\"\n```\n\nFor the practice input, expect `3`. The blank middle line is included. For your own file, the result depends on its contents; `3` is not a universal success value. The command contains no write operation.\n\nIf `python3` is not found, use a system with Python 3 installed before retrying. If you see `FileNotFoundError`, check the terminal's folder and exact filename. If you see `UnicodeDecodeError`, stop and verify the source encoding; work on a UTF-8 copy rather than discarding characters or overwriting the original.\n\nYou now have a line count with its meaning defined. Keep the input unchanged; a different count is a reason to inspect its lines, not to alter them until the expected number appears.\n\n## Decision preservation and own quality review\n\nThe Before text omits essential facts; recovering them from the supplied factbase is not evidence that they were present in the draft. The actual editorial application here is source-first repair, not just polishing its sentences.\n\n| Decision from the factbase | Disposition and After location | Own check / limit |\n| --- | --- | --- |\n| Count all lines, including blank and unterminated final line | Restored explicitly in opening and expected result | Fixture and empty-file command checks; no claim about all possible file formats. |\n| Do not modify input | Preserved from source; opening, command and ending | Local execution compared input bytes before/after. |\n| Python 3, UTF-8, correct folder/name | Restored before action | Tested in a fresh local directory; recipient installation not tested. |\n| Small files only | Restored before action | Command reads entire text; no memory benchmark claimed. |\n| Exact action and success sign | Replaced vague instruction with command and conditional `3` | Real local fixture result recorded separately. |\n| Recover without corrupting source | Replaced vague “fix the file” with named error handling | Missing-file and decoding-error cases exercised locally. |\n| Compact focused how-to | Single path retained; filler removed | Own editorial review, not a reader study. |\n\nFor an additional revision, ask to shorten the After while retaining these decisions. Check their meaning and position, not just whether “UTF-8” or “3” still appears somewhere. The generic method's Quickstart/Presentation distinction remains intact even though this narrowly scoped example legitimately needs one path.","end_line":57,"evidence_note":"Verbatim text authority from the clean target commit; not executable Python and not a run record. Historical claims in this text are attributed to the source, not re-executed here.","execution_status":"NOT_EXECUTED_HERE","file":"documentation-guide/example.md","id":"documentation-guide/example.md:text:1-57","line":1,"name":"Text authority","provenance":"SOURCE_EXTRACTION","side_effects":[],"signature":"Text authority: documentation-guide/example.md:1-57 (not a function)","source_binding":"BOUND","source_sha256":"365f53f44248fee621f930e8528f43da5a823a06c8c1bf596a69130d3ec505cd","stage_id":"example"}],"title":"Inspect the labelled teaching example","values":["documentation-guide/example.md:3-15,43-57"]},{"artifact":"Existing reader paths, provenance and license","artifact_binding":"UNKNOWN","execution_status":"NOT_EXECUTED_HERE","handoff":"Attach METHOD and example to an authorized AI chat, or apply to own sources. No special installation.","id":"entry","provenance":"SOURCE_EXTRACTION","purpose":"README and START-HERE already provide purpose, fit, starter request, expected outcome and recovery. Keep them as canonical user entry.","source_binding":"BOUND","source_units":[{"artifact_binding":"UNKNOWN","branches":[],"callees":[],"callers":[],"cleanup_status":"NOT_EXECUTED_HERE","code":"# Documentation Guide\n\nCreated by Roland Chotika with AI assistance.\n\n[Quickstart](#quickstart) · [Presentation](#presentation) · [Offline visual entry](START-HERE.html)\n\n## Quickstart\n\n- **What:** reusable instructions for writing or revising guides from sources.\n- **Why:** keep agreed meaning and its place in the reader's path through later edits—not merely the same keywords.\n- **Fit:** maintained guides, start pages and how-tos. A normal prompt is enough for a sentence correction.\n- **Need:** an AI tool that accepts pasted text or attachments, source material you may share, and a place to save the answer. No special assistant or installation.\n\n```text\nSources + reader's goal\n          ↓\nShared facts and decisions\n      ↙             ↘\nQuickstart      Presentation\n act now       understand why\n      ↘             ↙\n Revisions preserve meaning\n```\n\n**Start:** attach or paste [METHOD.md](METHOD.md) and [example.md](example.md) into a new chat, then send:\n\n\u003e Apply METHOD.md to the Source facts, assignment and Before text in example.md. Produce a clearer English how-to and a concise decision-preservation check. Use only those facts; ignore the provided After and review until you have drafted your answer. Do not publish or modify files. Distinguish checks you actually performed from checks still needed.\n\n**Expect:** a how-to with prerequisites, exact action, expected result and recovery, plus a check against the source facts. Compare your answer with the labelled example; identical wording is not required. This is a runnable chat assignment, not a special slash command. Do not paste private material into a service unless its use is authorized.\n\nIf attachments are unavailable, open the files in a text editor and paste their contents with filename labels. If the assistant cannot execute commands, it must label the command check unperformed; you can run the example locally or leave it open. If it cannot read the input, stop the affected rewrite and supply the missing text rather than asking it to infer facts.\n\nFor your own document, provide METHOD.md, your sources, the current draft if any and prior decisions. State the reader, task, output language and destination. Ask for two paths only when both first understanding and repeat use are needed. Save agreed decisions alongside the maintained document, not just in a disposable chat.\n\n## Presentation\n\nReadable sentences can still lose what a reader needs. Shortening a guide may remove its reason to exist, move a prerequisite after the action, or hide an essential answer in an optional explanation. Documentation Guide connects writing to source material and keeps those decisions available for the next revision.\n\nIts specific contribution is a reusable editorial discipline: establish the subject and supported value first, select appropriate reader paths, then check that changes preserve meaning, importance and location. A capable assistant can do the same from a detailed prompt. This package organizes those instructions; it does not add model capabilities or establish measured savings.\n\nThe diagram above shows why Quickstart and Presentation share facts. The first serves immediate action, the second explains why and how. They are not duplicate manuals, and a focused how-to can use one path. [METHOD.md](METHOD.md) is the operational instruction; [REFERENCE.md](REFERENCE.md) explains the decisions behind it.\n\nThe [new illustrative example](example.md) shows the method applied to an offline line-counting how-to: source facts, a deliberately weak draft, a revised version and a preservation check are all inspectable. It is not a recovered historical case or an independent user experiment.\n\nStart with the [Quickstart](#quickstart), then judge the actual answer: can a reader see the task, take the first action and recognize success without guessing? Automated checks and the author's own review do not establish that a new reader has understood it. Check the resulting guide in its actual destination and, when required, observe the intended reader completing the task.\n\n## Scope and package status\n\nThe files are offline-readable; using an online AI service is separate. Browser layout is provided by START-HERE.html, not guaranteed for every Markdown renderer. Wiki publishing, automatic skill discovery and recipient-side AI execution are not bundled integrations.\n\nThis sanitized export is **published as part of the project collection**. Rights and redistribution remain subject to [PROVENANCE.md](PROVENANCE.md); MIT has been explicitly authorized for this export; see [LICENSE](LICENSE). The package contains README.md, METHOD.md, REFERENCE.md, START-HERE.html, example.md PROVENANCE.md and LICENSE. Internal review records are not included. Do not infer an open-source license from another component of a combined package.","end_line":51,"evidence_note":"Verbatim text authority from the clean target commit; not executable Python and not a run record. Historical claims in this text are attributed to the source, not re-executed here.","execution_status":"NOT_EXECUTED_HERE","file":"documentation-guide/README.md","id":"documentation-guide/README.md:text:1-51","line":1,"name":"Text authority","provenance":"SOURCE_EXTRACTION","side_effects":[],"signature":"Text authority: documentation-guide/README.md:1-51 (not a function)","source_binding":"BOUND","source_sha256":"1dd1bd924f52bb28a831ee9d476421c3ae37305587cc9c518f9b17d6ae03e74b","stage_id":"entry"},{"artifact_binding":"UNKNOWN","branches":[],"callees":[],"callers":[],"cleanup_status":"NOT_EXECUTED_HERE","code":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\u003ctitle\u003eDocumentation Guide\u003c/title\u003e\n\u003cstyle\u003e\n*{box-sizing:border-box}body{margin:0;color:#182e35;background:#fafbf9;font:18px/1.5 system-ui,sans-serif}main{max-width:920px;margin:auto;padding:22px}nav{display:flex;gap:22px;flex-wrap:wrap}a{color:#145c70}h1{font-size:32px;line-height:1.2;margin:18px 0}h2{font-size:26px;line-height:1.2}section{padding-bottom:36px;scroll-margin-top:16px}li{margin:6px 0}figure{margin:16px 0;padding:12px;border:1px solid #617c85;background:#eef4f3;text-align:center}figcaption{font-si the explanation when the wording changes\u003c/h2\u003e\n\u003cp id=\"presentation-benefit\"\u003eA shorter guide can lose its purpose or hide a prerequisite. This method ties writing to sources and checks that agreed meaning keeps its importance and place.\u003c/p\u003e\n\u003cfigure id=\"presentation-graphic\"\u003e\u003cpre\u003eSources → agreed decisions\n↙                         ↘\nAct: Quickstart     Understand: Presentation\n↘   review changes against decisions   ↙\u003c/pre\u003e\u003cfigcaption\u003eBoth paths share facts; a focused how-to can use one.\u003c/figcaption\u003e\u003c/figure\u003e\n\u003cp class=\"action\" id=\"presentation-action\"\u003e\u003ca href=\"#quickstart\"\u003eStart with a small task\u003c/a\u003e or \u003ca href=\"METHOD.md\"\u003eread the method\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eA detailed ordinary prompt can do this too. Reusing the instructions and keeping a short decision baseline makes the editorial discipline explicit; no measured savings or unique model capability is claimed.\u003c/p\u003e\n\u003cp\u003eThe \u003ca href=\"example.md\"\u003enew illustrative example\u003c/a\u003e shows source facts, a weak draft, a revision and a check. It is not a historical case or a newcomer study. The result still needs checking in its actual destination.\u003c/p\u003e\u003c/section\u003e\n\u003csection id=\"start\"\u003e\u003ch2\u003eTry it in your AI chat\u003c/h2\u003e\n\u003cp\u003eOpen \u003ca href=\"METHOD.md\"\u003eMETHOD.md\u003c/a\u003e and \u003ca href=\"example.md\"\u003eexample.md\u003c/a\u003e. Attach them to a new chat, or paste their text with filename labels, then send this request. No installation or special command is needed. Use only material you are authorized to share.\u003c/p\u003e\n\u003cblockquote\u003eApply METHOD.md to the Source facts, assignment and Before text in example.md. Produce a clearer English how-to and a concise decision-preservation check. Use only those facts; ignore the provided After and r function allUnits(){return M.stages.flatMap(s=>s.source_units)}function renderCode(st){const units=allUnits(),q=(st.filter||'').toLowerCase(),filtered=units.filter(u=>!q||[u.signature,u.file,u.code].join(' ').toLowerCase().includes(q)),chosen=filtered.find(u=>u.id===st.unit)||filtered[0]||units[0],layout=add(view,el('section','code-layout')),side=add(layout,el('aside','panel')),body=add(layout,el('section','panel content'));add(side,el('h2','','Einzelfunktionen'));const input=add(side,el('input'));input.placeholder='Funktion oder Datei suchen';input.value=st.filter||'';input.onchange=()=>go({mode:'code',filter:input.value,unit:null},'Suche: '+(input.value||'alle'));add(side,el('p','muted',filtered.length+' von '+units.length));const fl=add(side,el('div','function-list'));filtered.forEach(u=>action(fl,u.signature,u.file+':'+u.line+' · '+u.execution_status,{mode:'code',unit:u.id,node:nodes[st.node].stage_id===u.stage_id?st.node:firstNode(u.stage_id)}));if(!filtered.length){add(body,el('p','','Keine passenden Source Units.'));return}add(body,el('div','eyebrow',stages[chosen.stage_id].title));add(body,el('h2','',chosen.signature));add(body,el('div','source',chosen.file+':'+chosen.line+'–'+chosen.end_line));badges(body,[chosen.execution_status,chosen.cleanup_status,'Source: '+chosen.source_binding,'Artifact: '+chosen.artifact_binding]);tabs(body,[['code','Vollständiger Code'],['calls','Aufrufer & Calls'],['trace','Werte & Evidenz'],['branches','Abzweigungen & Effekte']],st.codeTab,(id,label)=>go({mode:'code',unit:chosen.id,node:nodes[st.node].stage_id===chosen.stage_id?st.node:firstNode(chosen.stage_id),codeTab:id},label));if(st.codeTab==='code')add(body,el('pre','',chosen.code));else if(st.codeTab==='calls'){list(body,'Callers',chosen.callers);list(body,'Callees (statische Namen)',chosen.callees)}else if(st.codeTab==='trace'){add(body,el('p','',chosen.evidence_note));badges(body,[chosen.execution_status,'Run: '+M.scenario.run_id]);if(chosen.cleanup_status==='NO_KNOWN_ENTRYPOINT')add(body,el('p','warn','Cleanup-Kandidat für weitere Untersuchung; kein Dead-Code-Urteil.'))}else{list(body,'Branches',chosen.branches);list(body,'Side effects',chosen.side_effects)}action(body,'Zweckbereich öffnen','Ziel: '+stages[chosen.stage_id].title+' · PM-Kontext und Nachbarfunktionen',{mode:'purpose',node:nodes[st.node].stage_id===chosen.stage_id?st.node:firstNode(chosen.stage_id)})}

function render(){const st=state();if(!nodes[st.node])st.node=firstNode(M.recommended_route[0]);document.querySelector('#run').textContent=M.scenario.run_id+' · commit '+M.target_commit+' · '+M.scenario.boundary;back.disabled=st.depth===0;start.disabled=st.depth===0;renderCrumb(st);document.querySelectorAll('.mode').forEach(b=>{b.classList.toggle('active',b.dataset.mode===st.mode);b.onclick=()=>go({mode:b.dataset.mode},b.textContent.trim())});view.replaceChildren();({project:renderProject,map:renderMapMode,purpose:renderPurpose,paths:renderPaths,code:renderCode,boundary:renderBoundary}[st.mode]||renderProject)(st);requestAnimationFrame(()=>{scrollTo(0,st.scroll||0);document.querySelectorAll('.map-wrap,.function-list,pre,.inspector-body').forEach((e,i)=>{const xy=(st.paneScroll||[])[i];if(xy){e.scrollLeft=xy[0];e.scrollTop=xy[1]}})})}
